<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Vault | Instant Web Games Collection</title>
  <meta name="description" content="Play 14 free instant arcade games: Tetris, Blackjack, Snake, Solitaire, Subway Runner, Dino, Flappy Bird, Slots, Roulette, Poker, 2048, and Idle Tycoon.">
  <link rel="stylesheet" href="./shared/css/shared.css">
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="arcade-nav">
    <div class="arcade-nav-left">
      <a href="./index.html" class="arcade-nav-brand">
        <span class="brand-icon">👾</span>
        <span class="brand-text">ARCADE VAULT</span>
        <span class="brand-badge">PRO</span>
      </a>
    </div>

    <div class="arcade-nav-right">
      <button class="btn-secondary" id="btn-random-game" title="Pick a random game">
        <span>🎲</span>
        <span class="btn-text">Random Game</span>
      </button>
      <button class="nav-icon-btn active" id="portal-btn-sound" title="Toggle Sound">
        <span id="portal-sound-icon">🔊</span>
      </button>
      <button class="nav-icon-btn" id="portal-btn-fullscreen" title="Toggle Fullscreen">
        <span>⛶</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="portal-hero">
    <div class="hero-glow"></div>
    <div class="hero-content">
      <span class="hero-tag">🕹️ RETRO & CASINO COLLECTION</span>
      <h1 class="hero-title">INSERT COIN & PLAY</h1>
      <p class="hero-sub">
        14 fully playable, high-performance browser games. No installs, no downloads, 100% free.
      </p>

      <!-- Global Search & Filter Bar -->
      <div class="search-bar-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="game-search-input" placeholder="Search games (e.g. Tetris, Blackjack, Runner, Poker)..." autocomplete="off">
        <button id="search-clear-btn" class="search-clear hidden">&times;</button>
      </div>

      <!-- Category Filter Tabs -->
      <nav class="category-tabs" id="category-tabs">
        <button class="cat-tab active" data-cat="all">🌟 All Games (14)</button>
        <button class="cat-tab" data-cat="arcade">🕹️ Arcade & Action</button>
        <button class="cat-tab" data-cat="casino">🎲 Casino & Betting</button>
        <button class="cat-tab" data-cat="puzzle">🧩 Cards & Puzzles</button>
        <button class="cat-tab" data-cat="idle">⏳ Idle & Casual</button>
      </nav>
    </div>
  </section>

  <!-- Games Grid -->
  <main class="portal-main">
    <div class="games-grid" id="games-grid">
      <!-- Injected dynamically by portal.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="portal-footer">
    <p>Built for GitHub Pages with HTML5 Canvas & Vanilla JavaScript.</p>
    <p class="footer-sub">Enjoy the arcade collection!</p>
  </footer>

  <div class="arcade-toast" id="arcade-global-toast">
    <span id="toast-icon">✨</span>
    <span id="toast-message">Notification</span>
  </div>

  <script src="./shared/js/audio-engine.js"></script>
  <script src="./portal.js"></script>
</body>
</html>
