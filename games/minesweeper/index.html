<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper Retro | Arcade Games</title>
  <meta name="description" content="Classic Minesweeper with smiley face status, custom difficulty, digital timer, and safe first click.">
  <link rel="stylesheet" href="../../shared/css/shared.css">
  <link rel="stylesheet" href="minesweeper.css">
</head>
<body>
  <div id="arcade-nav-mount" data-title="Minesweeper Retro" data-icon="💣"></div>

  <main class="mines-container">
    <!-- Difficulty Selector -->
    <div class="diff-selector-row">
      <button class="diff-btn active" data-diff="easy">Easy (9x9)</button>
      <button class="diff-btn" data-diff="medium">Medium (16x16)</button>
      <button class="diff-btn" data-diff="hard">Expert (30x16)</button>
    </div>

    <!-- Minesweeper Classic Console Window -->
    <div class="minesweeper-window glass-panel">
      <!-- Top Header Display (Mines, Smiley, Timer) -->
      <header class="mines-status-header">
        <div class="digital-lcd" id="lcd-mines">010</div>
        <button class="smiley-face-btn" id="btn-smiley" title="Restart">🙂</button>
        <div class="digital-lcd" id="lcd-timer">000</div>
      </header>

      <!-- Minefield Grid Frame -->
      <div class="minefield-scroll-wrapper">
        <div class="minefield-grid" id="minefield">
          <!-- Grid cells generated by JS -->
        </div>
      </div>
    </div>
  </main>

  <template id="game-instructions-template">
    <h4>Minesweeper Rules</h4>
    <p>Clear the minefield without detonating any hidden landmines!</p>
    <ul>
      <li><strong>Left Click / Tap:</strong> Uncover a cell. The number indicates how many adjacent mines surround it.</li>
      <li><strong>Right Click / Long Press:</strong> Plant or remove a warning flag 🚩.</li>
      <li><strong>Smiley Button:</strong> Click the smiley button to start a new game anytime.</li>
      <li><strong>Safe First Click:</strong> The first tile you click is always guaranteed to be completely safe!</li>
    </ul>
  </template>

  <script src="../../shared/js/audio-engine.js"></script>
  <script src="../../shared/js/arcade-nav.js"></script>
  <script src="minesweeper.js"></script>
</body>
</html>
